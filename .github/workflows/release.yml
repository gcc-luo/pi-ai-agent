name: Release Desktop App

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify-release-version "${{ github.ref_name }}"
        working-directory: apps/desktop

      - run: pnpm --filter @pi-web-ui/server build
      - run: pnpm --filter @pi-web-ui/web typecheck

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          for variable in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!variable:-}" ]; then
              unset "$variable"
            fi
          done

          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            for required in APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!required:-}" ]; then
                echo "Missing required macOS signing secret: $required" >&2
                exit 1
              fi
            done
          else
            export APPLE_SIGNING_IDENTITY="-"
          fi

          pnpm prepare-shell-runtime
          pnpm prepare-sidecar
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Verify macOS bundles
        run: |
          set -euo pipefail

          APP_PATH=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          DMG_PATH=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          SIDECAR_PATH="$APP_PATH/Contents/MacOS/pi-node"

          test -n "$APP_PATH"
          test -n "$DMG_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          SIDECAR_ENTITLEMENTS=$(codesign -d --entitlements - "$SIDECAR_PATH" 2>&1)
          grep -q 'com.apple.security.cs.allow-jit' <<<"$SIDECAR_ENTITLEMENTS"
          grep -q 'com.apple.security.cs.disable-library-validation' <<<"$SIDECAR_ENTITLEMENTS"
          hdiutil verify "$DMG_PATH"

          SMOKE_DIR=$(mktemp -d)
          mkdir -p "$SMOKE_DIR/runtime"
          tar -xzf "$APP_PATH/Contents/Resources/server-runtime.tar.gz" -C "$SMOKE_DIR/runtime"
          SMOKE_PORT=$(
            "$SIDECAR_PATH" -e 'const server=require("node:net").createServer();server.listen(0,"127.0.0.1",()=>{console.log(server.address().port);server.close()})'
          )
          HOST=127.0.0.1 \
            PORT="$SMOKE_PORT" \
            PI_WEB_UI_ROOT="$SMOKE_DIR/data" \
            PI_BUNDLED_RUNTIME_DIR="$SMOKE_DIR/runtime" \
            "$SIDECAR_PATH" "$SMOKE_DIR/runtime/dist/index.js" \
            >"$SMOKE_DIR/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; wait "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 100); do
            if curl --fail --silent --show-error "http://127.0.0.1:$SMOKE_PORT/healthz" | grep -q '"ok":true'; then
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$SMOKE_DIR/server.log"
              exit 1
            fi
            if [ "$attempt" -eq 100 ]; then
              cat "$SMOKE_DIR/server.log"
              exit 1
            fi
            sleep 0.2
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          if-no-files-found: error
          path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify-release-version "${{ github.ref_name }}"
        working-directory: apps/desktop

      - run: pnpm --filter @pi-web-ui/server build
      - run: pnpm --filter @pi-web-ui/web typecheck

      - name: Build Tauri app
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm prepare-shell-runtime && pnpm prepare-sidecar && npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig

  publish:
    name: Publish Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-artifacts
          path: artifacts/macos

      - name: Download macOS installer
        uses: actions/download-artifact@v4
        with:
          name: macos-installer
          path: artifacts/macos-installer

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/windows

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate latest.json
        id: notes
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES_FILE="docs/release-notes/v${VERSION}.md"
          if [[ ! -f "$NOTES_FILE" ]]; then
            echo "::error::Release notes not found: $NOTES_FILE"
            exit 1
          fi
          NOTES="$(cat "$NOTES_FILE")"
          echo "RELEASE_NOTES<<EOF" >> "$GITHUB_ENV"
          echo "$NOTES" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          # macOS files
          MACOS_TARGZ=$(ls artifacts/macos/*.app.tar.gz | head -1)
          MACOS_SIG=$(ls artifacts/macos/*.app.tar.gz.sig | head -1)
          MACOS_FILENAME=$(basename "$MACOS_TARGZ")
          MACOS_SIG_CONTENT=$(cat "$MACOS_SIG")

          # Windows files
          WIN_EXE=$(ls artifacts/windows/*.exe | grep -v '.sig' | head -1)
          WIN_SIG=$(ls artifacts/windows/*.exe.sig | head -1)
          WIN_FILENAME=$(basename "$WIN_EXE")
          WIN_SIG_CONTENT=$(cat "$WIN_SIG")

          REPO="${{ github.repository }}"

          cat > latest.json << EOJSON
          {
            "version": "${VERSION}",
            "notes": $(echo "$NOTES" | python3 -c 'import sys,json; print(json.dumps(sys.stdin.read()))'),
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MACOS_SIG_CONTENT}",
                "url": "https://github.com/${REPO}/releases/download/v${VERSION}/${MACOS_FILENAME}"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG_CONTENT}",
                "url": "https://github.com/${REPO}/releases/download/v${VERSION}/${WIN_FILENAME}"
              }
            }
          }
          EOJSON

          echo "Generated latest.json:"
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            ${{ env.RELEASE_NOTES }}

            ## 下载说明

            - macOS 手动安装请下载 `.dmg` 文件。
            - `.app.tar.gz` 是应用自动更新专用文件，请勿手动下载解压安装。
            - 未配置 Apple Developer 公证时，首次启动请右键应用并选择“打开”。
          draft: false
          prerelease: false
          files: |
            artifacts/macos-installer/*.dmg
            artifacts/macos/*.app.tar.gz
            artifacts/macos/*.app.tar.gz.sig
            artifacts/windows/*.exe
            artifacts/windows/*.exe.sig
            latest.json
          make_latest: true
