name: TUI cross-platform

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tui-launch:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pi-web-ui/server test -- tests/unit/tui-process-manager.test.ts
      - run: pnpm --filter @pi-web-ui/server build
